name: Wowhead - Post Last 3

on:
  workflow_dispatch:          # manual button only, never runs on its own

permissions:
  contents: write

jobs:
  post-last-three:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post the last 3 Live/Forever articles
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python wowhead_discord_webhook.py --latest 3

      - name: Save what has been posted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wowhead_seen.json
          git diff --cached --quiet || (git commit -m "Update seen articles" && git push)
